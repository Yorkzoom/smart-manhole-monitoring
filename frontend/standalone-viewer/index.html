<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能井盖监测系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="/echarts.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="dashboard" id="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="14" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M14 20v8a4 4 0 004 4h4a4 4 0 004-4v-8" stroke="currentColor" stroke-width="2"/>
            <path d="M10 28h20" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="12" r="3" fill="currentColor" opacity="0.4"/>
          </svg>
          <div class="logo-text">
            <h1>智能井盖监测系统</h1>
            <span class="logo-sub">Smart Manhole Cover Monitor</span>
          </div>
        </div>
      </div>
      <div class="header-center">
        <div class="location-widget" id="locationWidget">
          <svg class="location-pin" viewBox="0 0 16 16" width="14" height="14" fill="none">
            <path d="M8 1C5.5 1 3.5 3 3.5 5.5c0 3.3 4.5 9 4.5 9s4.5-5.7 4.5-9C12.5 3 10.5 1 8 1z" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="8" cy="5.5" r="1.5" fill="currentColor"/>
          </svg>
          <span class="location-display" id="locationDisplay">未设置</span>
          <input class="location-input hidden" id="locationInput" type="text" maxlength="50" placeholder="输入井盖位置">
          <button class="location-edit-btn" id="locationEditBtn" title="编辑位置">
            <svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M10 1.5L12.5 4 4.5 12H2v-2.5L10 1.5z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="status-indicator online" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-label">Online</span>
        </div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <main class="main">
      <section class="risk-section">
        <div class="risk-gauge" id="riskGauge">
          <div class="risk-ring-container">
            <svg class="risk-ring" viewBox="0 0 240 140">
              <path class="ring-bg" d="M 20 120 A 100 100 0 0 1 220 120"/>
              <path class="ring-fg" id="ringFg" d="M 20 120 A 100 100 0 0 1 220 120" stroke-linecap="round"/>
            </svg>
            <div class="risk-inner">
              <span class="risk-score" id="riskScore">--</span>
              <span class="risk-label" id="riskLabel">--</span>
            </div>
          </div>
          <div class="risk-legend">
            <span class="risk-legend-item" data-level="0">低</span>
            <span class="risk-legend-item" data-level="1">中</span>
            <span class="risk-legend-item" data-level="2">高</span>
            <span class="risk-legend-item" data-level="3">紧急</span>
          </div>
        </div>
        <div class="risk-quick-stats" id="quickStats">
          <div class="quick-stat">
            <span class="qs-label">最高风险</span>
            <span class="qs-value" id="topRisk">--</span>
          </div>
          <div class="quick-stat">
            <span class="qs-label">传感器数</span>
            <span class="qs-value">6</span>
          </div>
          <div class="quick-stat">
            <span class="qs-label">运行时长</span>
            <span class="qs-value" id="uptime">--</span>
          </div>
        </div>
      </section>

      <section class="sensors-section">
        <div class="section-bar">
          <h2 class="section-title">传感器数据</h2>
          <span class="section-badge">实时</span>
        </div>
        <div class="sensors-grid" id="sensorsGrid"></div>
      </section>

      <section class="chart-section">
        <div class="section-bar">
          <h2 class="section-title">数据趋势</h2>
          <div class="chart-controls" id="chartControls"></div>
        </div>
        <div class="chart-container" id="trendChart"></div>
      </section>

      <section class="alerts-section">
        <div class="section-bar">
          <h2 class="section-title">告警日志</h2>
          <span class="alert-count" id="alertCount">0</span>
        </div>
        <div class="alerts-list" id="alertsList">
          <div class="alerts-empty">等待数据接入...</div>
        </div>
      </section>

      <section class="ai-section">
        <div class="section-bar">
          <h2 class="section-title">AI 智能分析</h2>
          <span class="ai-status" id="aiStatus">等待数据</span>
        </div>
        <div class="ai-content" id="aiContent">
          <div class="ai-placeholder">数据收集中，首次分析将在 30 秒后进行...</div>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
