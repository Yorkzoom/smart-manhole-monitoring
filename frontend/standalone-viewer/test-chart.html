<html>
<head><script src="/echarts.min.js"></script></head>
<body style="background:#111;padding:20px">
<div id="c" style="width:800px;height:400px;border:2px solid #f00"></div>
<script>
var c = echarts.init(document.getElementById('c'));
c.setOption({
  xAxis: { type: 'category', data: ['A','B','C'] },
  yAxis: { type: 'value' },
  series: [{ type: 'line', data: [10, 20, 15], lineStyle: { color: '#0f0', width: 3 } }],
});
c.resize();
document.body.innerHTML += '<p style="color:#0f0">Chart initialized: ' + (c ? 'OK' : 'FAIL') + '</p>';
</script>
</body>
</html>
